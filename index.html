<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Протокол «Шмурдик» — квест по силлогизмам</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#070b0f;color:#d6e4ee;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:17px;line-height:1.65;min-height:100vh;
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(62,245,143,.10), transparent 60%),
      radial-gradient(ellipse at 8% 108%, rgba(255,207,92,.06), transparent 55%);
    background-attachment:fixed;
  }
  .wrap{max-width:880px;margin:0 auto;padding:22px 18px 70px}

  header{display:flex;align-items:center;justify-content:space-between;
         gap:16px;flex-wrap:wrap;margin-bottom:26px;
         border-bottom:1px solid #1d2b36;padding-bottom:14px}
  .brand{font-family:ui-monospace,Consolas,monospace;font-size:13px;
         letter-spacing:.16em;color:#3ef58f;text-transform:uppercase}
  .brand span{color:#48606f}
  .chaos{display:flex;align-items:center;gap:10px;
         font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.1em}
  .chaos-label{color:#7d93a5}
  .chaos-track{width:130px;height:9px;background:#131e26;border:1px solid #1d2b36;border-radius:6px;overflow:hidden}
  .chaos-fill{height:100%;width:100%;background:#ff6b6b;border-radius:6px;transition:width .5s ease, background .5s ease}
  .chaos-num{color:#7d93a5;min-width:38px;text-align:right}

  .card{background:#0e151c;border:1px solid #1d2b36;border-radius:14px;
        padding:22px 24px;margin-bottom:18px;
        box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card h2{margin:0 0 12px;font-size:22px;line-height:1.3;color:#eaf3fa}
  .card h3{margin:0 0 8px;font-size:16px;color:#3ef58f;
           font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em}
  .card p{margin:0 0 10px}
  .card p:last-child{margin-bottom:0}
  .card ul,.card ol{margin:8px 0 10px;padding-left:22px}
  .card li{margin-bottom:6px}
  .muted{color:#7d93a5}
  .center{text-align:center}

  .terminal{background:#050a0d;border:1px solid #16242e;
            border-radius:14px;padding:22px 24px;margin-bottom:20px;
            font-family:ui-monospace,Consolas,monospace;font-size:14.5px;line-height:1.85}
  .term-line{opacity:0;transform:translateY(8px);animation:slideIn .5s forwards}
  .term-line .ok{color:#3ef58f}
  .term-line .warn{color:#ffcf5c}
  .term-line .bad{color:#ff6b6b}
  .term-line .dim{color:#5b7387}
  @keyframes slideIn{to{opacity:1;transform:none}}
  .caret{display:inline-block;width:8px;height:15px;background:#3ef58f;
         vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .btn{display:inline-block;background:transparent;color:#3ef58f;
       border:1px solid #2c6b4a;border-radius:10px;padding:12px 26px;
       font-size:16px;font-family:inherit;cursor:pointer;
       transition:.18s;letter-spacing:.02em}
  .btn:hover{background:rgba(62,245,143,.1);border-color:#3ef58f;
             box-shadow:0 0 22px rgba(62,245,143,.18)}
  .btn:active{transform:translateY(1px)}
  .btn.alt{color:#ffcf5c;border-color:#6b5a2c}
  .btn.alt:hover{background:rgba(255,207,92,.1);border-color:#ffcf5c;
                 box-shadow:0 0 22px rgba(255,207,92,.16)}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;background:transparent}

  .options{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .option{text-align:left;background:#101a22;color:#d6e4ee;
          border:1px solid #223440;border-radius:10px;padding:13px 16px;
          font-size:16px;font-family:inherit;line-height:1.5;cursor:pointer;
          transition:.16s;display:flex;gap:12px;align-items:flex-start}
  .option:hover:not(:disabled){border-color:#3ef58f;background:#132430;
                               box-shadow:0 0 18px rgba(62,245,143,.1)}
  .option:disabled{cursor:default}
  .option .letter{font-family:ui-monospace,Consolas,monospace;color:#4d6b7d;
                  font-size:14px;padding-top:2px;min-width:16px}
  .option.correct{border-color:#3ef58f;background:rgba(62,245,143,.12)}
  .option.correct .letter{color:#3ef58f}
  .option.wrong{border-color:#ff6b6b;background:rgba(255,107,107,.10);opacity:.75}
  .option.wrong .letter{color:#ff6b6b}
  .option.faded{opacity:.35}
  .option.selected{border-color:#ffcf5c;background:#1a2210}

  .feedback{margin-top:16px;border-radius:12px;padding:16px 18px;
            font-size:15.5px;border:1px solid;animation:slideIn .3s forwards}
  .feedback.good{background:rgba(62,245,143,.07);border-color:#2c6b4a;color:#b9f5d4}
  .feedback.bad{background:rgba(255,107,107,.07);border-color:#7a3434;color:#ffc9c9}
  .feedback b{color:#fff}
  .feedback .head{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
                  letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:8px}
  .feedback.good .head{color:#3ef58f}
  .feedback.bad .head{color:#ff6b6b}

  .qmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
         font-family:ui-monospace,Consolas,monospace;font-size:13px;
         color:#7d93a5;margin-bottom:10px;letter-spacing:.06em}
  .bar{height:6px;background:#131e26;border-radius:5px;overflow:hidden;margin-bottom:20px}
  .bar-fill{height:100%;width:0;background:linear-gradient(90deg,#2c6b4a,#3ef58f);
            border-radius:5px;transition:width .4s ease}
  .tag{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
       letter-spacing:.16em;color:#48606f;text-transform:uppercase;margin-bottom:10px}
  .condition{font-size:18.5px;color:#eaf3fa;line-height:1.55;margin:0 0 4px}
  .big-emoji{font-size:56px;line-height:1;margin-bottom:10px}
  .scoreline{font-size:18px;margin:6px 0}
  .rank{font-size:19px;margin:6px 0 14px}
  .rank b{color:#ffcf5c}

  .analogy-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15.5px}
  .analogy-table th,.analogy-table td{border:1px solid #223440;padding:10px 12px;text-align:left}
  .analogy-table th{background:#101a22;color:#7d93a5;font-family:ui-monospace,Consolas,monospace;
                    font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .analogy-table td select{background:#0e151c;color:#d6e4ee;border:1px solid #2c6b4a;
                           border-radius:8px;padding:7px 10px;font-family:inherit;font-size:15px;
                           width:100%;cursor:pointer}
  .analogy-table td select:focus{outline:none;border-color:#3ef58f}
  .analogy-table td.wrong-cell select{border-color:#ff6b6b;background:rgba(255,107,107,.08)}
  .analogy-table td.correct-cell select{border-color:#3ef58f;background:rgba(62,245,143,.08)}

  .cipher{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
  .cipher-item{background:#101a22;border:1px solid #223440;border-radius:8px;
               padding:8px 12px;font-size:14.5px}
  .cipher-item b{color:#3ef58f;font-family:ui-monospace,Consolas,monospace}

  footer{text-align:center;color:#3a4d5c;font-size:12.5px;
         font-family:ui-monospace,Consolas,monospace;margin-top:34px;letter-spacing:.08em}
  @media (max-width:560px){
    .card,.terminal{padding:18px 16px}
    .condition{font-size:17px}
    body{font-size:16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">ЛогоЛаб <span>//</span> Протокол «Шмурдик»</div>
    <div class="chaos">
      <span class="chaos-label">ХАОС</span>
      <div class="chaos-track"><div class="chaos-fill" id="chaosFill"></div></div>
      <span class="chaos-num" id="chaosNum">100%</span>
    </div>
  </header>

  <main id="screen"></main>

  <footer>ЛогоЛаб · отдел логической безопасности · стажёрский доступ</footer>
</div>

<script>
/* =========================================================
   1. ДАННЫЕ: ШИФР
   ========================================================= */
const CIPHER = [
  { key: 'А', pair: 'Печь — Камин' },
  { key: 'Б', pair: 'Отравление — Смерть' },
  { key: 'В', pair: 'Враг — Неприятель' },
  { key: 'Г', pair: 'Бодрость — Вялость' },
  { key: 'Д', pair: 'Капля — Душ' },
  { key: 'Е', pair: 'Муравей — Насекомое' }
];

// Большая база пар: по 5–6 на каждый тип связи.
// Из неё на каждое прохождение случайно выбираются 8.
const ALL_ANALOGY_PAIRS = [
  // А — функциональная связь (выполняют одну и ту же функцию)
  { id: 1,  left: 'Автобус',   right: 'Троллейбус', correct: 'А' },
  { id: 2,  left: 'Ножницы',   right: 'Нож',        correct: 'А' },
  { id: 3,  left: 'Ручка',     right: 'Карандаш',   correct: 'А' },
  { id: 4,  left: 'Ложка',     right: 'Вилка',      correct: 'А' },
  { id: 5,  left: 'Топор',     right: 'Пила',       correct: 'А' },
  { id: 6,  left: 'Метла',     right: 'Пылесос',    correct: 'А' },

  // Б — причина — следствие
  { id: 7,  left: 'Испуг',     right: 'Бегство',    correct: 'Б' },
  { id: 8,  left: 'Дождь',     right: 'Лужа',       correct: 'Б' },
  { id: 9,  left: 'Огонь',     right: 'Дым',        correct: 'Б' },
  { id: 10, left: 'Голод',     right: 'Слабость',   correct: 'Б' },
  { id: 11, left: 'Удар',      right: 'Синяк',      correct: 'Б' },
  { id: 12, left: 'Смех',      right: 'Слёзы',      correct: 'Б' },

  // В — синонимы
  { id: 13, left: 'Смелый',    right: 'Храбрый',    correct: 'В' },
  { id: 14, left: 'Красивый',  right: 'Прекрасный', correct: 'В' },
  { id: 15, left: 'Грустный',  right: 'Печальный',  correct: 'В' },
  { id: 16, left: 'Дом',       right: 'Жилище',     correct: 'В' },
  { id: 17, left: 'Путь',      right: 'Дорога',     correct: 'В' },

  // Г — антонимы
  { id: 18, left: 'Холодный',  right: 'Горячий',    correct: 'Г' },
  { id: 19, left: 'День',      right: 'Ночь',       correct: 'Г' },
  { id: 20, left: 'Добро',     right: 'Зло',        correct: 'Г' },
  { id: 21, left: 'Высокий',   right: 'Низкий',     correct: 'Г' },
  { id: 22, left: 'Быстрый',   right: 'Медленный',  correct: 'Г' },
  { id: 23, left: 'Свет',      right: 'Тьма',       correct: 'Г' },

  // Д — часть — целое
  { id: 24, left: 'Глава',     right: 'Роман',      correct: 'Д' },
  { id: 25, left: 'Колесо',    right: 'Автомобиль', correct: 'Д' },
  { id: 26, left: 'Палец',     right: 'Рука',       correct: 'Д' },
  { id: 27, left: 'Ствол',     right: 'Дерево',     correct: 'Д' },
  { id: 28, left: 'Комната',   right: 'Дом',        correct: 'Д' },

  // Е — вид — род
  { id: 29, left: 'Яблоко',    right: 'Фрукт',      correct: 'Е' },
  { id: 30, left: 'Роза',      right: 'Цветок',     correct: 'Е' },
  { id: 31, left: 'Кошка',     right: 'Животное',   correct: 'Е' },
  { id: 32, left: 'Дуб',       right: 'Дерево',     correct: 'Е' },
  { id: 33, left: 'Карась',    right: 'Рыба',       correct: 'Е' }
];

/* =========================================================
   2. ДАННЫЕ: ТЕСТ (14 силлогизмов)
   ========================================================= */
const QUESTIONS = [
  {
    id: 1,
    condition: 'Шмурдик боится как мышей, так и тараканов.',
    options: [
      { text: 'Шмурдик не боится тараканов.', correct: false,
        feedback: 'В условии сказано «как мышей, так и тараканов» — то есть боится и тех, и других. Ты случайно прочитал «или» вместо «и».' },
      { text: 'Шмурдик боится мышей.', correct: true },
      { text: 'Шмурдик боится мышей сильнее, чем тараканов.', correct: false,
        feedback: 'Это как сказать: «Петя любит и яблоки, и груши. Значит, яблоки он любит больше». В условии нет ни слова про сравнение — только про сам факт страха.' }
    ],
    explain: 'Из «А и Б» всегда следует «А» (и следует «Б»). А вот сравнение из простого перечисления не выводится.'
  },
  {
    id: 2,
    condition: 'Известно, что грымзик обязательно или полосат, или рогат, или то и другое вместе.',
    options: [
      { text: 'Грымзик не может быть безрогим.', correct: false,
        feedback: 'Разрешено «или полосат, или рогат». Безрогий, но полосатый грымзик — совершенно законный. Это как «на обед или суп, или компот»: компота может не быть, если есть суп.' },
      { text: 'Грымзик не может быть одновременно неполосатым и безрогим.', correct: true },
      { text: 'Грымзик не может быть полосатым и безрогим одновременно.', correct: false,
        feedback: 'Наоборот! Именно такой грымзик — полосатый и безрогий — полностью соответствует условию. Запрещён только вариант «ни то, ни другое».' }
    ],
    explain: '«Или А, или Б, или оба» запрещает ровно один случай: «не А и не Б».'
  },
  {
    id: 3,
    condition: 'Если запырку отравить, то она сразу начнёт пускать пузыри.',
    options: [
      { text: 'Если запырка пускает пузыри, то её отравили.', correct: false,
        feedback: 'Это классическая ошибка «обратного вывода». Сравни: «Если идёт дождь, земля мокрая. Земля мокрая — значит, шёл дождь?» Нет: землю могли полить из шланга. Пузыри — тоже лишь один из способов их получить.' },
      { text: 'Если запырку не отравить, то она не будет пускать пузыри.', correct: false,
        feedback: 'Это ошибка «отрицания условия». Сравни: «Если идёт дождь, земля мокрая. Дождя нет — значит, земля сухая?» А шланг? Из «нет отравления» никак не следует «нет пузырей».' },
      { text: 'Если запырка не пускает пузыри, то она не отравлена.', correct: true }
    ],
    explain: 'Правило Modus Tollens: из «А → Б» и «не Б» следует «не А».'
  },
  {
    id: 4,
    condition: 'Все охлотушки умеют играть в шашки.',
    options: [
      { text: 'Все, кто умеет играть в шашки, — охлотушки.', correct: false,
        feedback: 'Сравни: «Все коты — животные. Значит, все животные — коты?» В шашки играют и люди, и, возможно, другие существа. Условие говорит только про охлотушек.' },
      { text: 'Не бывает охлотушек, не умеющих играть в шашки.', correct: true },
      { text: 'Некоторые охлотушки не умеют играть в шашки.', correct: false,
        feedback: 'Это прямо противоречит слову «все». Если все охлотушки играют в шашки, то «охлотушка, которая не играет» — невозможна.' }
    ],
    explain: '«Все А — Б» переформулируется как «не бывает А, которые не Б». Но обратное «все Б — А» неверно.'
  },
  {
    id: 5,
    condition: 'Дубараторы бывают либо хорошими, либо плохими. Неправда, что этот дубаратор не плохой.',
    options: [
      { text: 'Этот дубаратор хороший.', correct: false,
        feedback: 'Двойное отрицание — ловушка. «Неправда, что он не плохой» = «он плохой». Сравни: «Неправда, что у меня нет кота» = «у меня есть кот».' },
      { text: 'Этот дубаратор плохой.', correct: true },
      { text: 'Про этого дубаратора ничего нельзя сказать.', correct: false,
        feedback: 'Можно! Двойное отрицание снимается: «не (не плохой)» = «плохой».' }
    ],
    explain: 'Двойное отрицание: «не (не А)» = «А».'
  },
  {
    id: 6,
    condition: 'В природе обнаружено более десятка тиалей. Все обнаруженные тиали сплошь красного цвета.',
    options: [
      { text: 'Все тиали на свете красные.', correct: false,
        feedback: 'Сравни: «Все лебеди, которых я видел, белые» — а в Австралии живут чёрные лебеди. Ты знаешь только про обнаруженных тиалей, а не про всех.' },
      { text: 'По крайней мере некоторые тиали красного цвета.', correct: true },
      { text: 'Тиалей не существует.', correct: false,
        feedback: 'В условии прямо сказано, что их обнаружено более десятка. Отрицать существование — значит спорить с условием.' }
    ],
    explain: 'Из «все обнаруженные» не следует «все вообще». Зато «некоторые» — следует.'
  },
  {
    id: 7,
    condition: 'Если тряхнуть бурдылькой, начнётся стрельба. Бурдылькой тряхнули.',
    options: [
      { text: 'Стрельба начнётся когда-нибудь.', correct: false,
        feedback: 'Слишком слабо. Условие обещает стрельбу как прямое следствие, а не «когда-нибудь потом». Вывод должен быть сильнее.' },
      { text: 'Стрельба уже началась.', correct: true },
      { text: 'Стрельбы не будет.', correct: false,
        feedback: 'Это противоречит условию: раз тряхнули — стрельба начинается.' }
    ],
    explain: 'Modus Ponens: из «А → Б» и «А» следует «Б».'
  },
  {
    id: 8,
    condition: 'Если тряхнуть перпелькой, немедленно начнётся стрельба. За последний час стрельбы не было.',
    options: [
      { text: 'Перпелькой не тряхнули.', correct: true },
      { text: 'Перпелькой тряхнули, но стрельбы почему-то не было.', correct: false,
        feedback: 'Условие гарантирует: тряхнули → стрельба. Значит, вариант «тряхнули, а стрельбы нет» невозможен. Сравни: «Если идёт дождь, асфальт мокрый. Асфальт сухой» — вывод один: дождя не было.' },
      { text: 'Нельзя ничего определить.', correct: false,
        feedback: 'Можно. Если бы тряхнули — была бы стрельба. Стрельбы нет → не тряхнули.' }
    ],
    explain: 'Modus Tollens: «А → Б», «не Б» ⇒ «не А».'
  },
  {
    id: 9,
    condition: 'Все шмурдики, которые боятся мышей, боятся и тараканов. Некоторые шмурдики боятся мышей.',
    options: [
      { text: 'Некоторые шмурдики боятся тараканов.', correct: true },
      { text: 'Все шмурдики боятся тараканов.', correct: false,
        feedback: 'Сравни: «Все отличники получают пятёрки. Некоторые ученики — отличники» — следует, что некоторые получают пятёрки, но не все ученики. Здесь тоже: только те, кто боится мышей.' },
      { text: 'Ни один шмурдик не боится тараканов.', correct: false,
        feedback: 'Прямо противоречит условию: те, кто боится мышей, точно боятся и тараканов.' }
    ],
    explain: 'Две посылки — «все, кто боится мышей, боятся тараканов» и «некоторые боятся мышей» — дают «некоторые боятся тараканов».'
  },
  {
    id: 10,
    condition: 'Ни один грымзик не умеет летать. Некоторые грымзики полосатые.',
    options: [
      { text: 'Некоторые полосатые существа не умеют летать.', correct: true },
      { text: 'Все полосатые существа не умеют летать.', correct: false,

const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* Выбирает 8 пар: по одной с каждого типа + 2 из остатка. */
function pickAnalogyPairs() {
  const byType = {};
  for (const p of ALL_ANALOGY_PAIRS) {
    (byType[p.correct] = byType[p.correct] || []).push(p);
  }
  const chosen = [];
  for (const key of ['А', 'Б', 'В', 'Г', 'Д', 'Е']) {
    const arr = byType[key];
    chosen.push(arr[Math.floor(Math.random() * arr.length)]);
  }
  const chosenIds = new Set(chosen.map(p => p.id));
  const remaining = shuffle(ALL_ANALOGY_PAIRS.filter(p => !chosenIds.has(p.id)));
  chosen.push(...remaining.slice(0, 2));
  return shuffle(chosen);
}

function updateHUD() {
  const c = Math.max(0, Math.min(100, state.chaos));
  chaosFill.style.width = c + '%';
  chaosNum.textContent = c + '%';
  if (c > 60)      chaosFill.style.background = '#ff6b6b';
  else if (c > 30) chaosFill.style.background = '#ffcf5c';
  else             chaosFill.style.background = '#3ef58f';
}

function checkAnalogy() {
  const fb = document.getElementById('analogyFeedback');
  let allCorrect = true;
  let wrongCount = 0;

  state.analogyPairs.forEach(p => {
    const sel = document.querySelector(`select[data-id="${p.id}"]`);
    const td = sel.closest('td');
    const chosen = sel.value;

    td.classList.remove('wrong-cell', 'correct-cell');

    if (!chosen || chosen !== p.correct) {
      allCorrect = false;
      wrongCount++;
      td.classList.add('wrong-cell');
      sel.value = '';
    } else {
      td.classList.add('correct-cell');
    }
  });

  if (allCorrect) {
    state.chaos = Math.max(0, state.chaos - 12);
    updateHUD();
    fb.innerHTML = `
      <div class="feedback good">
        <span class="head">Шлюз открыт</span>
        <p>Все восемь пар сопоставлены верно! Ты умеешь видеть логическую связь за словами — это первый шаг к силлогизмам.</p>
      </div>
      <div class="center" style="margin-top:16px">
        <button class="btn" id="toTheory">Перейти к руководству →</button>
      </div>
    `;
    document.getElementById('toTheory').addEventListener('click', () => {
      theoryIndex = 0;
      theoryAnswered = false;
      renderTheoryStep();
    });
  } else {
    state.chaos = Math.max(0, state.chaos - 2);
    updateHUD();
    fb.innerHTML = `
      <div class="feedback bad">
        <span class="head">Шлюз не поддался</span>
        <p>Неверно сопоставлено пар: <b>${wrongCount}</b>. Красные ячейки сброшены — подумай ещё раз и выбери заново.</p>
        <p class="muted" style="margin-top:8px">Подсказка: сверяй не слова, а <i>тип связи</i> между ними.</p>
      </div>
    `;
  }
}

      <p>${step.question}</p>

  `);

  theoryAnswered = false;

  document.querySelectorAll('#theoryOptions .option').forEach(btn => {

      const i = parseInt(btn.dataset.i, 10);

      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        fb.innerHTML = `<div class="feedback bad"><span class="head">Не совсем</span><p>${opt.feedback}</p><p class="muted" style="margin-top:8px">Попробуй другой вариант.</p></div>`;
      }
    });
  });

  document.getElementById('theoryNext').addEventListener('click', () => {
    if (!theoryAnswered) return;
    theoryIndex++;
    if (theoryIndex < THEORY_STEPS.length) renderTheoryStep();
    else startTest();
  });
}

/* =========================================================
   7. ТЕСТ
   ========================================================= */
function startTest() {
  state.questions = shuffle(QUESTIONS).slice(0, QUESTIONS_PER_TEST);
  state.qIndex = 0;
  state.score = 0;
  state.chaos = 100;
  updateHUD();
  renderQuestion();
}

function renderQuestion(keepFirstTry) {
  if (!keepFirstTry) state.firstTry = true;
  state.qLocked = false;

  const q = state.questions[state.qIndex];
  state.currentQ = q;
  state.currentOptions = shuffle(q.options);

  const total = state.questions.length;

  setScreen(`
    <div class="qmeta">
      <span>ВОПРОС ${state.qIndex + 1} ИЗ ${total}</span>
      <span>ВЕРНО С ПЕРВОЙ ПОПЫТКИ: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${state.qIndex / total * 100}%"></div></div>

    <div class="card">
      <p class="condition">${q.condition}</p>
      <div class="options" id="qOptions">
        ${state.currentOptions.map((o, i) => `
          <button class="option" data-i="${i}">
            <span class="letter">${'abc'[i]}</span><span>${o.text}</span>
          </button>`).join('')}
      </div>
      <div class="center" style="margin-top:18px">
        <button class="btn" id="qConfirm" disabled>Подтвердить ответ</button>
      </div>
    </div>
  `);

  let selected = null;

  document.querySelectorAll('#qOptions .option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.qLocked) return;
      document.querySelectorAll('#qOptions .option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selected = parseInt(btn.dataset.i, 10);
      document.getElementById('qConfirm').disabled = false;
    });
  });

  document.getElementById('qConfirm').addEventListener('click', () => {
    if (selected === null || state.qLocked) return;
    state.qLocked = true;
    renderTestResult(selected);
  });
}

function renderTestResult(selectedIndex) {
  const q = state.currentQ;
  const opt = state.currentOptions[selectedIndex];

  if (opt.correct) {
    if (state.firstTry) {
      state.score++;
      state.chaos = Math.max(0, state.chaos - 10);
    } else {
      state.chaos = Math.max(0, state.chaos - 6);
    }
    updateHUD();

    setScreen(`
      <div class="card center">
        <div class="big-emoji">🎉</div>
        <h2>${PRAISE[Math.floor(Math.random() * PRAISE.length)]}</h2>
        <p class="scoreline">Верно!</p>
        <p class="muted">${q.explain}</p>
      </div>
      <div class="center">
        <button class="btn" id="nextQ">${state.qIndex + 1 === state.questions.length ? 'Завершить протокол →' : 'Далее →'}</button>
      </div>
    `);

    document.getElementById('nextQ').addEventListener('click', () => {
      state.qIndex++;
      if (state.qIndex < state.questions.length) renderQuestion();
      else renderResult();
    });

  } else {
    state.firstTry = false;
    setScreen(`
      <div class="card center">
        <div class="big-emoji">😬</div>
        <h2>Логика сломалась</h2>
        <p class="scoreline">Этот ответ неверен.</p>
        <p class="muted">${opt.feedback}</p>
        <p class="muted" style="margin-top:12px">Не страшно. Попробуй ещё раз — варианты перемешаны, а правильный ответ ждёт.</p>
      </div>
      <div class="center">
        <button class="btn alt" id="retryQ">Попробовать снова →</button>
      </div>
    `);

    document.getElementById('retryQ').addEventListener('click', () => {
      renderQuestion(true); // сохранить firstTry = false
    });
  }
}

/* =========================================================
   8. РЕЗУЛЬТАТ
   ========================================================= */
function renderResult() {
  state.chaos = 0;
  updateHUD();

  const s = state.score;
  const total = state.questions.length;
  const rankData = RANKS.find(r => r.score === s) || RANKS[0];

  setScreen(`
    <div class="card center">
      <div class="big-emoji">${rankData.emoji}</div>
      <h2>Протокол «Шмурдик» выполнен</h2>
      <p class="scoreline">Верных ответов с первой попытки: <b>${s} / ${total}</b></p>
      <p class="rank">Звание: <b>${rankData.title}</b></p>
      <p class="muted">${rankData.note}</p>
      <p class="muted" style="margin-top:14px">
        Светофоры снова мигают по правилам, пылесосы вернулись на пол, а в столовой снова суп. 🍲
      </p>
    </div>

    <div class="card">
      <h3>Что запомнить на будущее</h3>
      <ul>
        <li><b>А → Б, А</b> ⇒ Б (Modus Ponens).</li>
        <li><b>А → Б, не Б</b> ⇒ не А (Modus Tollens).</li>
        <li>Из «А → Б» и «Б» <b>не следует</b> А. Из «А → Б» и «не А» <b>не следует</b> не Б.</li>
        <li>Из «все» следует «некоторые», но из «некоторые» <b>не следует</b> «все».</li>
      </ul>
    </div>

    <div class="center">
      <button class="btn" id="againBtn">Пройти заново (новый набор) →</button>
    </div>
  `);

  document.getElementById('againBtn').addEventListener('click', () => {
    renderIntro();
  });
}

/* =========================================================
   9. СТАРТ
   ========================================================= */
updateHUD();
renderIntro();
</script>
</body>
</html>
